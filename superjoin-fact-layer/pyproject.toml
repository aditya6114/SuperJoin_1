[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superjoin-fact-layer"
version = "0.1.0"
description = "Superjoin Fact Knowledge Layer - Module 1 (Document Ingestion & Parsing)"
authors = [
    {name = "Superjoin", email = "engineering@superjoin.ai"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "docling>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
